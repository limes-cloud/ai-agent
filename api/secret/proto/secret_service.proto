syntax = "proto3";

package aiagent.api.secret;
option go_package = "ai-agent/api/secret;secret";

import "api/secret/proto/secret.proto";
import "google/api/annotations.proto";

service Secret{

  // ListSupplier 获取密钥分组列表
  rpc ListSupplier (ListSupplierRequest) returns (ListSupplierReply) {
    option (google.api.http) = {
      get: "/ai-agent/api/secret/suppliers",
    };
  }

  // ListSecretGroup 获取密钥分组列表
  rpc ListSecretGroup (ListSecretGroupRequest) returns (ListSecretGroupReply) {
    option (google.api.http) = {
      get: "/ai-agent/api/secret/groups",
    };
  }

  // CreateSecretGroup 创建密钥分组
  rpc CreateSecretGroup (CreateSecretGroupRequest) returns (CreateSecretGroupReply) {
    option (google.api.http) = {
      post: "/ai-agent/api/secret/group",
      body: "*"
    };
  }

  // UpdateSecretGroup 更新密钥分组
  rpc UpdateSecretGroup (UpdateSecretGroupRequest) returns (UpdateSecretGroupReply) {
    option (google.api.http) = {
      put: "/ai-agent/api/secret/group",
      body: "*"
    };
  }

  // DeleteSecretGroup 删除密钥分组
  rpc DeleteSecretGroup (DeleteSecretGroupRequest) returns (DeleteSecretGroupReply) {
    option (google.api.http) = {
      delete: "/ai-agent/api/secret/group",
    };
  }

  // ListSecret 获取密钥信息列表
  rpc ListSecret (ListSecretRequest) returns (ListSecretReply) {
    option (google.api.http) = {
      get: "/ai-agent/api/secrets",
    };
  }

  // CreateSecret 创建密钥信息
  rpc CreateSecret (CreateSecretRequest) returns (CreateSecretReply) {
    option (google.api.http) = {
      post: "/ai-agent/api/secret",
      body: "*"
    };
  }

  // UpdateSecret 更新密钥信息
  rpc UpdateSecret (UpdateSecretRequest) returns (UpdateSecretReply) {
    option (google.api.http) = {
      put: "/ai-agent/api/secret",
      body: "*"
    };
  }

  // DeleteSecret 删除密钥信息
  rpc DeleteSecret (DeleteSecretRequest) returns (DeleteSecretReply) {
    option (google.api.http) = {
      delete: "/ai-agent/api/secret",
    };
  }
}