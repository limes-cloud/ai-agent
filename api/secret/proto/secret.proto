syntax = "proto3";

package aiagent.api.secret;

option go_package = "ai-agent/api/secret;secret";
import "validate/validate.proto";

message ListSupplierRequest {

}

message ListSupplierReply {
  repeated string list = 1;
}

message ListSecretGroupRequest {
  uint32 page = 1[(validate.rules).uint32 = {gt: 0}];
  uint32 pageSize = 2[(validate.rules).uint32 = {gt: 0,lte:50}];
  optional string name = 3;
  optional string supplier = 4;
}

message ListSecretGroupReply {
  message SecretGroup {
    uint32 id = 1;
    string name = 2;
    string host = 3;
    string supplier = 4;
    uint32 createdAt = 5;
    uint32 updatedAt = 6;
  }

  uint32 total = 1;
  repeated SecretGroup list = 2;
}

message CreateSecretGroupRequest {
  string name = 1[(validate.rules).string = {min_len: 1}];
  string host = 2[(validate.rules).string = {uri: true}];
  string supplier = 3[(validate.rules).string = {min_len: 1,max_len: 32}];
}

message CreateSecretGroupReply {
  uint32 id = 1;
}

message UpdateSecretGroupRequest {
  uint32 id = 1[(validate.rules).uint32 = {gt: 0}];
  string name = 2;
  string host = 3;
  string supplier = 4;
}

message UpdateSecretGroupReply {
}

message DeleteSecretGroupRequest {
  uint32 id = 1[(validate.rules).uint32 = {gte:0}];
}

message DeleteSecretGroupReply {
}


message ListSecretRequest {
  uint32 page = 1[(validate.rules).uint32 = {gt: 0}];
  uint32 pageSize = 2[(validate.rules).uint32 = {gt: 0,lte:50}];
  optional uint32 groupId = 3;
  optional bool status = 4;
  optional string name = 5;
}

message ListSecretReply {
  message Group {
    uint32 id = 1;
    string name = 2;
  }

  message Data{
    uint32 id = 1;
    uint32 groupId = 2;
    string token = 3;
    optional bool status = 4;
    optional string reason = 5;
    string name = 6;
    uint32 createdAt = 7;
    uint32 updatedAt = 8;
    Group group = 9;
  }

  uint32 total = 1;
  repeated  Data list = 2;
}

message CreateSecretRequest {
  uint32 groupId = 1[(validate.rules).uint32 = {gte: 1}];
  string token = 2[(validate.rules).string = {min_len: 1}];
  string name = 3[(validate.rules).string = {min_len: 1}];
}

message CreateSecretReply {
  uint32 id = 1;
}

message UpdateSecretRequest {
  uint32 id = 1[(validate.rules).uint32 = {gt: 0}];
  uint32 groupId = 2;
  string token = 3;
  string name = 4;
  optional bool status = 5;
}

message UpdateSecretReply {
}

message DeleteSecretRequest {
  uint32 id = 1[(validate.rules).uint32 = {gte:0}];
}

message DeleteSecretReply {
}
